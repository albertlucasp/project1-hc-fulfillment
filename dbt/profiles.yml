hc_fulfillment:
  target: dev
  outputs:
    dev:
      type: sqlserver
      driver: "ODBC Driver 18 for SQL Server"
      host: localhost
      port: 1433
      user: sa
      password: "{{ env_var('MSSQL_SA_PASSWORD') }}"
      database: hc_fulfillment
      schema: staging
      trust_cert: true
    prod:
      type: sqlserver
      driver: "ODBC Driver 18 for SQL Server"
      host: localhost
      port: 1433
      user: sa
      password: "{{ env_var('MSSQL_SA_PASSWORD') }}"
      database: hc_fulfillment
      schema: staging
      trust_cert: true